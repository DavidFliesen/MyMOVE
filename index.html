<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyMOVE!</title>
<meta name="description" content="MyMOVE! - a companion app that helps Veterans stick with the VA MOVE! Weight Management Program, one week at a time.">
<meta name="theme-color" content="#12284c">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyMOVE!">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#eef2f7;color:#1b2533;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding-bottom:84px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:#1d4f91}
.hidden{display:none!important}
header#top{position:sticky;top:0;z-index:20;background:#12284c;color:#ffffff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.brand{font-size:22px;font-weight:800;letter-spacing:.3px}
.brand b{color:#f2b632}
#topdate{font-size:14px;color:#c9d4e6;text-align:right}
main#view{max-width:720px;margin:0 auto;padding:14px 14px 24px}
h1{font-size:24px;margin:4px 0 10px}
h2{font-size:20px;margin:0 0 8px}
h3{font-size:17px;margin:12px 0 6px}
p{margin:0 0 10px}
.card{background:#ffffff;border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:0 1px 3px rgba(18,40,76,.12)}
.card.navy{background:#12284c;color:#ffffff}
.card.navy .muted{color:#c9d4e6}
.card.gold{background:#fff6dd;border:1px solid #f2d27a}
.card.red{background:#fdeeee;border:1px solid #f1b8b8}
.muted{color:#5b6778;font-size:15px}
.small{font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 16px;background:#1d4f91;color:#ffffff;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;min-height:46px}
.btn.gold{background:#f2b632;color:#12284c}
.btn.red{background:#b3261e}
.btn.ghost{background:#e4ebf5;color:#12284c}
.btn.block{display:block;width:100%}
.btn.sm{padding:8px 12px;min-height:38px;font-size:15px;border-radius:10px}
.btn:active{transform:scale(.98)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick .btn{padding:10px 4px;font-size:14px;line-height:1.2}
.quick .btn span{display:block;font-size:22px;line-height:1.1}
label{display:block;font-weight:700;font-size:15px;margin:10px 0 4px}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;padding:11px 12px;border:1px solid #b9c5d6;border-radius:10px;background:#ffffff;min-height:46px}
textarea{min-height:84px;resize:vertical}
input[type=range]{width:100%;height:36px}
input:focus,select:focus,textarea:focus{outline:3px solid #f2b632;outline-offset:1px}
.check{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #e6ebf2;font-weight:400;margin:0;font-size:16px}
.check:last-child{border-bottom:0}
.check input{width:24px;height:24px;flex:0 0 24px;margin-top:1px;accent-color:#1d4f91}
.bar{height:14px;background:#e4ebf5;border-radius:8px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:#2e7d4f;border-radius:8px}
.bar i.over{background:#c77700}
.stat{background:#f4f7fb;border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;color:#12284c}
.stat span{font-size:13px;color:#5b6778}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;background:#e4ebf5;color:#12284c;font-size:13px;font-weight:700}
.pill.green{background:#dff3e6;color:#1d5e38}
.pill.gold{background:#fbe7b0;color:#6b4b00}
.list .item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #e6ebf2}
.list .item:last-child{border-bottom:0}
.list .item .x{border:0;background:#f3e2e2;color:#8a1c1c;border-radius:8px;width:34px;height:34px;font-weight:800;cursor:pointer;flex:0 0 34px}
.seg{display:flex;background:#dfe6f0;border-radius:12px;padding:4px;margin:0 0 12px}
.seg button{flex:1;border:0;background:transparent;padding:10px 4px;border-radius:9px;font-weight:700;color:#3a4a60;cursor:pointer}
.seg button.on{background:#ffffff;color:#12284c;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.datebar{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.datebar button{border:0;background:#ffffff;border-radius:10px;width:46px;height:46px;font-size:20px;font-weight:800;color:#12284c;box-shadow:0 1px 3px rgba(0,0,0,.12);cursor:pointer}
.mod{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #e6ebf2;cursor:pointer}
.mod:last-child{border-bottom:0}
.mod .num{flex:0 0 42px;height:42px;border-radius:50%;background:#e4ebf5;color:#12284c;font-weight:800;display:flex;align-items:center;justify-content:center}
.mod.done .num{background:#2e7d4f;color:#ffffff}
.mod.now .num{background:#f2b632;color:#12284c}
.mod .t{font-weight:700}
.mod .s{font-size:14px;color:#5b6778}
.pts li{margin:0 0 8px 20px}
.goalrow{padding:10px 0;border-bottom:1px solid #e6ebf2}
.goalrow:last-child{border-bottom:0}
.dots{display:flex;gap:6px;margin-top:6px}
.dots button{width:34px;height:34px;border-radius:50%;border:2px solid #b9c5d6;background:#ffffff;font-size:12px;font-weight:700;color:#5b6778;cursor:pointer}
.dots button.on{background:#2e7d4f;border-color:#2e7d4f;color:#ffffff}
.dots button.today{border-color:#f2b632}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid #e6ebf2;vertical-align:top}
th{background:#f4f7fb;font-size:14px}
td.r,th.r{text-align:right}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#ffffff;border-top:1px solid #d4dce8;display:flex;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 8px rgba(18,40,76,.08)}
nav#tabs button{flex:1;border:0;background:transparent;padding:8px 2px 9px;color:#5b6778;font-size:12px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav#tabs button svg{width:26px;height:26px;fill:none;stroke:#5b6778;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav#tabs button.on{color:#12284c}
nav#tabs button.on svg{stroke:#1d4f91}
#sheetwrap{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:rgba(10,20,40,.55);display:flex;align-items:flex-end;justify-content:center;padding-top:calc(env(safe-area-inset-top) + 20px)}
#sheet{background:#eef2f7;width:100%;max-width:720px;max-height:100%;min-height:0;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheethead{flex:0 0 auto;background:#12284c;color:#ffffff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheethead h2{margin:0;font-size:19px}
.sheethead button{border:0;background:#2b4470;color:#ffffff;width:40px;height:40px;border-radius:50%;font-size:18px;font-weight:800;cursor:pointer;flex:0 0 40px}
#sheetbody{flex:1 1 auto;min-height:0;overscroll-behavior:contain;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#12284c;color:#ffffff;padding:11px 18px;border-radius:24px;font-weight:700;font-size:15px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
#cheer{pointer-events:none;position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:70;display:none;max-width:696px;margin:0 auto}
#cheer.show{display:block;-webkit-animation:pop .35s ease-out;animation:pop .35s ease-out}
.cheerin{display:flex;gap:10px;align-items:flex-start;background:#fff6dd;border:2px solid #f2b632;color:#12284c;border-radius:14px;padding:12px 8px 12px 16px;box-shadow:0 6px 22px rgba(18,40,76,.28)}
.cheerin .grow{min-width:0;font-weight:400}
.cheerin .small{font-weight:400;line-height:1.4}
.cheerin b{display:block;font-size:17px;margin-bottom:2px}
.cheerin.big{background:#12284c;color:#ffffff;border-color:#f2b632}
.cheerin.big b{color:#f2b632;font-size:19px}
.cheerin.big b:before{content:"\2605  "}
.cheerin button{pointer-events:auto;border:0;background:transparent;font-size:18px;font-weight:800;color:inherit;width:40px;height:40px;flex:0 0 40px;cursor:pointer}
@-webkit-keyframes pop{from{-webkit-transform:translateY(24px);opacity:0}to{-webkit-transform:none;opacity:1}}
@keyframes pop{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.wins li{margin:0 0 6px 20px}
.big{font-size:34px;font-weight:800;color:#12284c;line-height:1.1}
.timer{font-size:56px;font-weight:800;text-align:center;color:#12284c;font-variant-numeric:tabular-nums;margin:10px 0}
.breath{width:180px;height:180px;margin:20px auto;border-radius:50%;background:#1d4f91;opacity:.85;transform:scale(.55);transition:transform 4s ease-in-out}
.breath.in{transform:scale(1)}
.breathlabel{text-align:center;font-size:22px;font-weight:800;color:#12284c}
canvas{width:100%;height:220px;display:block}
.tip{border-left:5px solid #f2b632;padding-left:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chips button{border:1px solid #b9c5d6;background:#ffffff;border-radius:20px;padding:7px 12px;font-size:14px;cursor:pointer;text-align:left}
.foot{font-size:13px;color:#5b6778;text-align:center;margin-top:18px}
.grid2>*,.grid3>*,.row>*,.quick>*{min-width:0}
input,select,textarea{max-width:100%;min-width:0;display:block}
input[type=checkbox]{display:inline-block}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;text-align:left;line-height:1.2}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left}
input[type=search]{-webkit-appearance:none;appearance:none}
table{table-layout:fixed}
th,td{overflow-wrap:anywhere;word-wrap:break-word}
.card,.list .item .grow,.goalrow,.mod .grow{min-width:0;overflow-wrap:anywhere}
.results{margin-top:6px}
.res{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:1px solid #d4dce8;background:#ffffff;border-radius:10px;padding:10px 12px;margin:6px 0 0;cursor:pointer;min-height:48px}
.res:active{background:#e4ebf5}
@media (max-width:400px){.grid2{grid-template-columns:1fr}}
@media (max-width:380px){.quick{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header id="top"><div class="brand">My<b>MOVE!</b></div><div id="topdate"></div></header>
<main id="view"></main>
<nav id="tabs" class="hidden">
  <button data-act="tab" data-v="today" id="tab-today"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Today</button>
  <button data-act="tab" data-v="log" id="tab-log"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Log</button>
  <button data-act="tab" data-v="program" id="tab-program"><svg viewBox="0 0 24 24"><path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4z"/><path d="M20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"/></svg>Program</button>
  <button data-act="tab" data-v="progress" id="tab-progress"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</button>
  <button data-act="tab" data-v="more" id="tab-more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button>
</nav>
<div id="sheetwrap" class="hidden"><div id="sheet" role="dialog" aria-modal="true"><div class="sheethead"><h2 id="sheettitle"></h2><button data-act="closeSheet" aria-label="Close">&#10005;</button></div><div id="sheetbody"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="cheer" role="status" aria-live="polite"></div>
<input type="file" id="importfile" accept="application/json,.json" class="hidden">

<script>
(function () {
'use strict';

var VERSION = '1.4.1';
var KEY = 'mymove.v1';

/* ---------- Program content (adapted from the MOVE! Veteran Workbook, 2023) ---------- */
var MODULES = [
 {n:1,t:'Welcome to MOVE!',s:'Find your why and set your target',
  why:'MOVE! is not a diet. It is a lifestyle program built on three things: behavior, nutrition and physical activity. Committing to at least 6 months gives you the best shot at lasting results.',
  pts:['Losing just 5% of your weight can lower your risk of heart disease, high blood pressure, type 2 diabetes and some cancers.','Start with a goal of losing 5% to 10% of your current weight.','A safe pace is \u00bd to 2 pounds per week.','Change one or two things at a time, not everything at once.','Make every goal SMART: Specific, Measurable, Action-oriented, Realistic, Time-based.','Keys to success: track every day, weigh in at least weekly, ask for support, and celebrate wins.'],
  todo:['Write down your reasons for making a change','Set your weight-loss goal','Start logging everything you eat and drink','Start logging your active minutes','Set one healthy-eating and one activity SMART goal'],
  tools:['goal','smart','why']},
 {n:2,t:'Tracking What You Do',s:'Tracking effort predicts success',
  why:'Your Food and Activity Log is the most powerful tool in your kit. Just writing things down changes behavior. Veterans who log and get feedback are more likely to meet their goals.',
  pts:['Be real: log what you actually ate, not what you planned.','Be accurate: measure portions, read labels, time your activity.','Be complete: include drinks, sauces, butter, bites and tastes.','Log right away. Memory runs low: in the workbook example, one Veteran was off by nearly 1,000 calories in a single day.','Count activity done at moderate effort or harder: you can talk, but not sing.','Can\u2019t write it down? Take a photo of your plate or record a voice note.','Reward yourself (not with food) for meeting goals.'],
  todo:['Log food every day this week','Log active minutes every day this week','Pick at least 3 non-food rewards','Set this week\u2019s two SMART goals'],
  tools:['rewards','smart']},
 {n:3,t:'Tip the Balance',s:'Calories in vs. calories out',
  why:'Your weight follows your energy balance. Eat fewer calories than you burn and you lose weight. Most people lose about 1 pound a week with a daily deficit of about 500 calories.',
  pts:['General daily targets: 1,200\u20131,500 calories for women, 1,500\u20131,800 for men. Your MOVE! team can tailor yours.','Cut calories gradually so your body adjusts and you are not too hungry.','You can create the deficit by eating less, moving more, or both.','Liquid calories add up fast. Shrinking a 20 oz sugary drink to 12 oz saves roughly 90\u2013130 calories.','Look for patterns in your log: skipped meals, late-night snacks, eating when not hungry, eating more when out.','As you lose weight your body needs less, so your target may need a re-check later.'],
  todo:['Confirm your daily calorie target','Find 2 patterns in last week\u2019s log','Make one drink swap','Try one healthy food swap','Set this week\u2019s two SMART goals'],
  tools:['drink','burn','swaps']},
 {n:4,t:'Eat Wisely',s:'Build a healthy plate',
  why:'Before every meal, ask yourself: how healthy is my plate? Eating from all food groups in the right proportions gets you the nutrients you need with fewer calories.',
  pts:['My Healthy Plate: \u00bd non-starchy vegetables and fruit, \u00bc whole grains or starchy vegetables, \u00bc lean protein, plus a little low-fat dairy and a low- or no-calorie drink.','BE MINDFUL: Buy healthy foods. Eat breakfast. Make a healthy plate. Involve others, sit at the table, slow down. Nourish your body, don\u2019t skip meals. Drink water before meals. Fix food at home. Use a plate for snacks. Limit high-fat, high-sugar foods.','Water is the best drink. Most adults need 9\u201313 cups of fluid a day.','Make at least half your grains whole grains.','It can take up to 20 minutes for your brain to register that you are full. Eat slowly.','All foods can fit. No food is forbidden; it\u2019s about how much and how often.'],
  todo:['Rate your plate at 3 dinners','Drink a glass of water before each meal','Swap one refined grain for a whole grain','Replace one sugary drink','Set this week\u2019s two SMART goals'],
  tools:['plate','portions']},
 {n:5,t:'Get Fit for Life',s:'Start slow, build up, keep moving',
  why:'Activity helps manage weight and lowers your risk of heart disease, stroke and diabetes. It also improves sleep, mood and stress. Strive for progress, not perfection.',
  pts:['Aim for 150 minutes a week of moderate activity (or 75 vigorous).','For weight loss, work up to 300 minutes of moderate activity a week (or 150 vigorous).','Do strengthening activities at least 2 days a week.','Spread it out: be active at least 5 days a week. Any amount counts.','Moderate means you can talk but not sing (RPE 4\u20136).','Three kinds of activity: lifestyle (chores, yard work), work (stairs, walking breaks) and programmed exercise (cardio, strength, flexibility, balance).','Warm up and cool down 5\u201310 minutes. Increase how often before how hard.','Slow down or stop if you feel very tired, sick, lightheaded, or your joints hurt.'],
  todo:['Compare your current activity to the targets','Put activity on your calendar','Try one new activity','Set this week\u2019s two SMART goals'],
  tools:['hr','rpe']},
 {n:6,t:'Take Charge of Your Health',s:'Thoughts, feelings and behavior',
  why:'How you think about a situation shapes how you feel and what you do next. Catching unhelpful thoughts keeps you in the right mindset to keep going.',
  pts:['Thoughts, feelings and behaviors all influence each other.','Mindfulness means noticing what is going on inside and around you, without judging it.','Common unhelpful thoughts: all-or-nothing, making excuses, filtering, self-labeling, comparing, assuming the worst, overgeneralizing, and \u201cmust\u201d statements.','Rethink in 4 steps: Recognize it, Question it, Ask if it helps, Consider alternatives.','Hunger or habit? If it\u2019s just an urge, distract yourself for 15 minutes.','Body image is more than skin-deep. Focus on what your body can do; not every win shows on the scale.'],
  todo:['When you eat more than planned, note the situation, feeling and thought','Rethink 2 unhelpful thoughts','Rate your eating triggers','List 3 non-food ways to cope','Set this week\u2019s two SMART goals'],
  tools:['thought','triggers']},
 {n:7,t:'Menu Planning, Shopping & Cooking',s:'Plan it, shop it, cook it',
  why:'Planning meals, shopping smart, reading labels and cooking in healthier ways turns good intentions into regular habits, and can save time and money.',
  pts:['Aim for 2\u20133 balanced meals and 1\u20132 healthy snacks, about 3\u20134 hours apart.','Eat something soon after you wake up.','Plan meals for the week, then build your shopping list from the plan.','Shop with a list and not on an empty stomach.','Food labels: check serving size and servings per container first. 5% Daily Value or less is low; 20% or more is high.','Bake, broil, grill, roast, steam, or saut\u00e9 with a little oil or cooking spray instead of frying.','Cook to safe temperatures and refrigerate leftovers within 2 hours.'],
  todo:['Plan 3 days of meals','Shop from a list','Read 3 food labels','Try one healthier cooking method','Set this week\u2019s two SMART goals'],
  tools:['plan','label','temps']},
 {n:8,t:'Managing Challenges',s:'Problem-solve and push past plateaus',
  why:'Everyone runs into roadblocks. People who plan for challenges, and have a fix ready, are more successful at keeping changes going.',
  pts:['Problem solving in 5 steps: 1) Describe the problem in detail. 2) Brainstorm options. 3) Pick one to try. 4) Make a positive, step-by-step plan. 5) Try it, then see how it worked.','Weight plateaus are normal. As you lose weight your body needs fewer calories.','To move past a plateau: tighten up tracking, measure portions again, check drinks and extras, re-check your calorie target with your team, and change up your activity.','Be patient. Keep doing what works.'],
  todo:['Solve one problem using the 5 steps','Re-measure portions for 3 days','Change one thing about your activity','Set this week\u2019s two SMART goals'],
  tools:['problem']},
 {n:9,t:'Pump Up Your Physical Activity',s:'Cardio, steps, strength and stretch',
  why:'Now it\u2019s time to build a complete routine: warm-up, cardio, strength, flexibility and cool-down, increasing gradually and safely.',
  pts:['Every session: warm up, do the activity, cool down.','Engage your core for posture, balance and safer movement.','Build cardio a few minutes at a time.','Steps: find your average, then add a little each week. Try to get at least 250 steps every hour.','Strength: work the major muscle groups at least 2 days a week, at an effort of 7\u20139.','Stretch when muscles are warm. Hold gently; don\u2019t bounce.','Seated and chair exercises count.'],
  todo:['Find your daily step baseline','Do strength activities twice this week','Stretch after each session','Set this week\u2019s two SMART goals'],
  tools:['steps','rpe']},
 {n:10,t:'Conquer Triggers and Cues',s:'Hunger vs. cravings',
  why:'Sights, smells, places, people, times of day and feelings can all prompt eating when you are not hungry. Spotting them is how you break the chain.',
  pts:['Hunger builds slowly, many foods will satisfy it, and it stops when you are full.','A craving hits suddenly, wants one specific food, and fades if you wait it out.','Cravings rise and fall like a wave. Ride it out with a 15-minute distraction.','Manage your environment: keep tempting foods out of sight, put healthy foods in front.','Before social events: eat a healthy snack, decide ahead what you\u2019ll have, and keep a no-calorie drink in hand.','Break the chain: change any link between the trigger and the eating.'],
  todo:['Name your top 3 triggers','Rearrange your kitchen or pantry','Use the craving timer at least once','Set this week\u2019s two SMART goals'],
  tools:['craving','triggers']},
 {n:11,t:'Finesse Your Food',s:'Carbs, protein, fats and smart swaps',
  why:'Knowing what\u2019s in your food helps you make choices that keep you full and satisfied on fewer calories.',
  pts:['Carbohydrates: choose fiber-rich whole grains, fruit, vegetables and beans. Limit added sugars.','Protein: lean meats, fish, eggs, beans, low-fat dairy and nuts help you feel full.','Fats: favor unsaturated fats (olive or canola oil, nuts, fish). Limit saturated fat.','Fat has about 9 calories per gram vs. 4 for carbs and protein, so small amounts add up.','Healthy swaps save calories without giving up the meal.','Skip fad diets. Be skeptical of fast-loss promises, cutting whole food groups, or pills and powders.'],
  todo:['Make 3 healthy swaps','Check the fat source in one meal','Set this week\u2019s two SMART goals'],
  tools:['swaps']},
 {n:12,t:'Dust Yourself Off',s:'Handling slips',
  why:'A slip is a short step off your plan, and everyone has them. What matters is how quickly you get back on track.',
  pts:['Expect slips. They are part of change, not proof of failure.','Know your high-risk situations ahead of time.','Watch for all-or-nothing thinking: \u201cI blew it, why bother.\u201d','A slip only becomes a relapse when you stop getting back on track.','Get back on at the very next meal or the very next walk.','Reach out to your support people or your MOVE! team.'],
  todo:['Write your slip plan','Name 3 high-risk situations','Pick a support person to call','Set this week\u2019s two SMART goals'],
  tools:['slip','thought']},
 {n:13,t:'Dining Out',s:'Restaurants, fast food, takeout and parties',
  why:'You can eat out and still reach your goals. It comes down to planning ahead and a few simple requests.',
  pts:['Plan before you go: look at the menu online.','Ask how food is made. Choose grilled, baked, broiled or steamed.','Ask for sauces and dressings on the side.','Swap fries for a side salad or vegetables.','Split a meal, or box up half before you start.','Fast food: smallest size, skip the combo, drink water or an unsweetened drink.','At social events, focus on the people, not the food.','After eating out, log it honestly and get back on plan at the next meal. Don\u2019t skip meals to \u201cmake up\u201d for it.'],
  todo:['Check a menu before going out','Use 3 dining-out strategies','Log a restaurant meal honestly','Set this week\u2019s two SMART goals'],
  tools:['dining']},
 {n:14,t:'Manage Stress and Find Support',s:'Calm the mind, build your team',
  why:'Stress can drive eating and push activity off the schedule. Managing stress and leaning on support keeps you moving forward.',
  pts:['Track your stress: how high, what caused it, how you responded.','Sort stressors into ones you can change and ones you can\u2019t.','Mindfulness and slow breathing calm the body. Try a few minutes a day.','Physical activity is one of the best stress relievers.','Build your support team: family, friends, other Veterans and your MOVE! team. Tell them exactly how they can help.'],
  todo:['Track your stress 3 days this week','Practice the breathing exercise daily','Ask one person for specific support','Set this week\u2019s two SMART goals'],

 {n:15,t:'Fine Tune Your Physical Activity',s:'Adjust, adapt and stay motivated',

/* ---------- Helpers ---------- */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseYmd(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function today() { return ymd(new Date()); }
function addDays(s, n) { var d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }

function nowTime() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

function commas(n) { n = Math.round(n); var s = String(Math.abs(n)), out = ''; while (s.length > 3) { out = ',' + s.slice(-3) + out; s = s.slice(0, -3); } return (n < 0 ? '-' : '') + s + out; }

/* ---------- Program math ---------- */
function weekNo() { if (!S.profile) { return 1; } var d = daysBetween(S.profile.startDate, today()); return d < 0 ? 1 : Math.floor(d / 7) + 1; }
function weekStart(w) { return addDays(S.profile.startDate, (w - 1) * 7); }
function weekDates(w) { var a = [], s = weekStart(w), i; for (i = 0; i < 7; i++) { a.push(addDays(s, i)); } return a; }
function currentWeight() { var w = S.weights; if (!w.length) { return S.profile ? S.profile.startWeight : 0; } return sortedWeights()[w.length - 1].lb; }
function sortedWeights() { return S.weights.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }); }
function goalLbs() { var p = S.profile; return Math.round(p.startWeight * p.goalPct / 100); }
function goalWeight() { return r1(S.profile.startWeight - goalLbs()); }
function targetDate() { var p = S.profile; return addDays(p.startDate, Math.ceil(goalLbs() / p.rate) * 7); }
function foodTotal(d) { var a = S.food[d] || [], t = 0, i; for (i = 0; i < a.length; i++) { t += num(a[i].cal); } return t; }
function actOut(d) { var a = S.act[d] || [], t = 0, i; for (i = 0; i < a.length; i++) { t += num(a[i].kcal); } return t; }
function weekActivity(w) {
  var ds = weekDates(w), mod = 0, vig = 0, strength = 0, activeDays = 0, i, j, a, dayMin;
  for (i = 0; i < ds.length; i++) {
    a = S.act[ds[i]] || []; dayMin = 0;
    var hasStr = false;
    for (j = 0; j < a.length; j++) {
      var m = num(a[j].min), r = num(a[j].rpe);
      if (r >= 7) { vig += m; } else if (r >= 4) { mod += m; }
      if (r >= 4) { dayMin += m; }
      if (a[j].type === 'Strength') { hasStr = true; }
    }
    if (dayMin >= 10) { activeDays++; }
    if (hasStr) { strength++; }
  }
  return {mod: mod, vig: vig, equiv: mod + vig * 2, strength: strength, days: activeDays};
}
function loggedDays(n) { var c = 0, i, d = today(); for (i = 0; i < n; i++) { if ((S.food[addDays(d, -i)] || []).length) { c++; } } return c; }
function streak() { var c = 0, d = today(); if (!(S.food[d] || []).length) { d = addDays(d, -1); } while ((S.food[d] || []).length) { c++; d = addDays(d, -1); } return c; }
function getGoals(w) { if (!S.goals[w]) { S.goals[w] = {eat: '', act: '', eatDays: {}, actDays: {}}; } return S.goals[w]; }
function lastWeighDate() { var w = sortedWeights(); return w.length ? w[w.length - 1].date : null; }

/* ---------- Navigation ---------- */
var ACT = {};
function setTab(t) {
  S.ui.tab = t; save();
  var names = ['today', 'log', 'program', 'progress', 'more'], i;

  render();

}
function render() {

}

ACT.setMode = function (v) {
  var enr = v === 'enrolled', first = !S.profile;
  $('s_mode').value = v;
  $('s_m_new').className = enr ? '' : 'on'; $('s_m_enr').className = enr ? 'on' : '';
  $('s_enr').className = enr ? '' : 'hidden'; $('s_nowbox').className = enr ? '' : 'hidden';
  $('s_wtl').textContent = enr || !first ? 'Starting weight (lb)' : 'Current weight (lb)';
  $('s_wthint').textContent = enr ? 'Starting weight = what you weighed when you started MOVE!. You can add weigh-ins in between from the Progress tab.' : '';
  setupCalc();
};
function startFromWeek(w) { w = Math.max(1, Math.round(w)); return addDays(today(), -(w - 1) * 7); }
function weekFromStart(s) { var d = daysBetween(s, today()); return d < 0 ? 1 : Math.floor(d / 7) + 1; }
function afterSetup() {
  var ids = ['s_wt', 's_now', 's_pct', 's_rate', 's_sex', 's_cal', 's_imp', 's_conf'], i;
  for (i = 0; i < ids.length; i++) { var el = $(ids[i]); if (el) { el.oninput = setupCalc; el.onchange = setupCalc; } }
  $('s_week').oninput = function () { var w = num(this.value); if (w >= 1) { $('s_start').value = startFromWeek(w); } setupCalc(); };
  $('s_start').onchange = function () { if (this.value) { if (this.value > today()) { this.value = today(); } $('s_week').value = weekFromStart(this.value); } setupCalc(); };
  setupCalc();
}
function setupStart() {
  if (val('s_mode') === 'enrolled' && val('s_start')) { return val('s_start'); }
  return S.profile ? S.profile.startDate : today();
}
function setupCalc() {
  var box = $('s_calc'); if (!box) { return; }
  var wt = num(val('s_wt')), pc = num(val('s_pct')), rate = num(val('s_rate')), sex = val('s_sex'), enr = val('s_mode') === 'enrolled';
  $('s_impv').textContent = val('s_imp'); $('s_confv').textContent = val('s_conf');
  var lo = sex === 'F' ? 1200 : 1500, hi = sex === 'F' ? 1500 : 1800;
  $('s_calhint').textContent = 'MOVE! general range for ' + (sex === 'F' ? 'women' : 'men') + ': ' + commas(lo) + '–' + commas(hi) + ' calories a day. Leave blank to use ' + commas(hi) + ' to start.';
  if (!wt) { box.innerHTML = 'Enter your weight to see your numbers.'; return; }
  var lbs = Math.round(wt * pc / 100), wks = Math.ceil(lbs / rate), start = setupStart();
  var h = '<b>Your target:</b> lose <b>' + lbs + ' lb</b> (' + pc + '%), from ' + r1(wt) + ' to <b>' + r1(wt - lbs) + ' lb</b>.<br>At ' + rate + ' lb a week that’s about <b>' + wks + ' weeks</b> from ' + (start === today() ? 'today' : fmtLong(start)) + ', around <b>' + fmtLong(addDays(start, wks * 7)) + '</b>.<br><span class="small">5% = ' + Math.round(wt * 0.05) + ' lb · 8% = ' + Math.round(wt * 0.08) + ' lb · 10% = ' + Math.round(wt * 0.1) + ' lb</span>';

}
function upsertWeight(d, lb) {
  var i;
  for (i = 0; i < S.weights.length; i++) { if (S.weights[i].date === d) { S.weights[i].lb = lb; return; } }
  S.weights.push({date: d, lb: lb});
}
function submitSetup() {
  var wt = r1(num(val('s_wt')));
  if (wt < 80 || wt > 700) { toast('Please enter your starting weight'); return; }
  var enr = val('s_mode') === 'enrolled', first = !S.profile;
  var start = first ? today() : S.profile.startDate;
  if (enr) {
    start = val('s_start');
    if (!start || start > today()) { toast('Pick a start date of today or earlier'); return; }
  }
  var nowRaw = val('s_now'), now = r1(num(nowRaw));
  if (enr && nowRaw !== '' && (now < 80 || now > 700)) { toast('Check your weight today'); return; }
  var sex = val('s_sex'), cal = Math.round(num(val('s_cal')));
  if (!cal) { cal = sex === 'F' ? 1500 : 1800; }
  if (cal < 1200) { cal = 1200; toast('Set to 1,200, the lowest the program uses'); }
  var p = S.profile || {};
  var oldStart = p.startDate, oldWt = p.startWeight, i;
  p.name = val('s_name').replace(/^\s+|\s+$/g, ''); p.sex = sex; p.heightIn = num(val('s_ht')) || '';

  p.importance = num(val('s_imp')); p.confidence = num(val('s_conf'));
  p.reasons = val('s_reasons'); p.concerns = val('s_concerns');
  p.enrolled = enr; p.startDate = start; p.startWeight = wt;

  upsertWeight(start, wt);
  if (enr && now >= 80) { upsertWeight(today(), now); }
  S.profile = p;
  var w = weekNo();
  save();
  closeSheet(false);
  if (first) {
    toast(enr ? 'Welcome aboard. Picking up at week ' + w + '.' : 'Your plan is set. Let’s MOVE!');
    S.ui.tab = 'today'; setTab('today'); openModule(w > 16 ? 16 : w);
    if (enr && now >= 80 && now < wt) { var ms0 = milestone(now, true); save(); cheer(ms0 ? ms0.t : 'Down ' + r1(wt - now) + ' lb so far!', 'Welcome to MyMOVE! You\u2019ve already put in ' + (w - 1) + ' week' + (w === 2 ? '' : 's') + ' of real work. Let\u2019s keep it going together.', true); }
  } else { toast('Plan saved' + (enr ? ' · week ' + w : '')); render(); }
}
